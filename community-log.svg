    <rect x="180" y="216" width="95" height="10" fill="#00D4FF"/>
    <text x="380" y="228">(Python)</text>

    <text x="30" y="250">HackerRank</text>
    <rect x="180" y="238" width="180" height="10" fill="#1a1a22"/>
    <rect x="180" y="238" width="110" height="10" fill="#FF2E88"/>
    <text x="380" y="250">(Java)</text>
  </g>
</svg>
