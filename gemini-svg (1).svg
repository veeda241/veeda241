<svg width="100%" height="150" viewBox="0 0 1000 150" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="pitwallBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070C18" />
      <stop offset="55%" stop-color="#0E1930" />
      <stop offset="100%" stop-color="#190B14" />
    </linearGradient>

    <linearGradient id="drsFlame" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#DC0000" stop-opacity="0" />
      <stop offset="55%" stop-color="#DC0000" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FFC906" stop-opacity="1" />
    </linearGradient>

    <linearGradient id="asphaltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#141D2E" />
      <stop offset="100%" stop-color="#0B111E" />
    </linearGradient>
  </defs>

  
  <rect width="1000" height="150" rx="12" fill="url(#pitwallBg)" stroke="#1E41FF" stroke-width="1.5" />

  
  <rect x="1" y="1" width="998" height="28" rx="11" fill="#0B1221" />
  <line x1="1" y1="29" x2="999" y2="29" stroke="#1E41FF" stroke-width="1" opacity="0.6" />

  
  <circle cx="22" cy="15" r="5" fill="#DC0000">
    <animate attributeName="opacity" values="1;0.25;1" dur="1.2s" repeatCount="indefinite" />
  </circle>
  <text x="34" y="19" fill="#FFFFFF" font-family="monospace" font-size="11" font-weight="bold">PIT WALL TELEMETRY // VYAS S</text>

