  <text x="550" y="19" fill="#38BDF8" font-family="monospace" font-size="11" font-weight="bold">ERS: DEPLOY</text>
  <text x="680" y="19" fill="#E2E8F0" font-family="monospace" font-size="11">SECTOR: PURPLE</text>
  <text x="835" y="19" fill="#FFC906" font-family="monospace" font-size="11" font-weight="bold">LAP 52/58</text>

  
  <line x1="333" y1="29" x2="333" y2="122" stroke="#1E41FF" stroke-width="1" stroke-dasharray="4 4" opacity="0.45" />
  <line x1="666" y1="29" x2="666" y2="122" stroke="#1E41FF" stroke-width="1" stroke-dasharray="4 4" opacity="0.45" />

  <text x="18" y="47" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="bold">S1 // DATA &amp; VALIDATION</text>
  <text x="350" y="47" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="bold">S2 // MULTIMODAL &amp; AGENTS</text>
  <text x="683" y="47" fill="#94A3B8" font-family="monospace" font-size="11" font-weight="bold">S3 // LOW-LATENCY INFERENCE</text>

  
  <rect x="12" y="104" width="976" height="22" rx="4" fill="url(#asphaltGrad)" />
  <line x1="16" y1="115" x2="984" y2="115" stroke="#475569" stroke-width="1.5" stroke-dasharray="18 14" />

  
  <rect x="12" y="126" width="976" height="5" rx="2" fill="#DC0000" />
  <line x1="12" y1="128.5" x2="988" y2="128.5" stroke="#FFC906" stroke-width="2" stroke-dasharray="20 20" />

  
  <g stroke="#38BDF8" stroke-width="1.2" opacity="0.3">
