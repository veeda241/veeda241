      <circle cx="53" cy="94.5" r="3.4" fill="#FFC906" />

      
      <path d="M90,111 L106,110 L106,114 L90,114 Z" fill="#DC0000" />
      <line x1="92" y1="109" x2="105" y2="109" stroke="#FFC906" stroke-width="1.2" />

      
      <circle cx="24" cy="113" r="8.5" fill="#090D16" stroke="#475569" stroke-width="2" />
