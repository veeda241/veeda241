  <rect x="12" y="135" width="976" height="6" rx="2" fill="#0B1221" stroke="#1E41FF" stroke-width="0.6" />
  <line x1="16" y1="138" x2="984" y2="138" stroke="#E2E8F0" stroke-width="2" stroke-dasharray="6 6" opacity="0.65" />
