      <rect x="4" y="88" width="13" height="3.5" fill="#FFC906" />

      
      <path d="M12,111 L19,97 L50,97 L68,104 L96,108 L100,113 L12,113 Z" fill="#1E41FF" />
      <path d="M26,97 L48,97 L57,104 L26,104 Z" fill="#DC0000" />
      <polygon points="60,103 80,107 60,108" fill="#FFC906" />

      
